name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Shell syntax
        run: bash -n scripts/daemon.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
