name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.9"
        required: true
        default: "v1.0.9"

# Validation/build jobs are read-only. Only the final publishing job receives
# contents:write, and it never checks out or executes repository code.
permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION=$(sed -n 's/.*CurrentVersion = "\(v[^"]*\)".*/\1/p' internal/updater/updater.go | head -n1)
          fi

          if [ -z "${VERSION}" ]; then
            echo "Unable to resolve release version"
            exit 1
          fi

          grep -Fq "CurrentVersion = \"${VERSION}\"" internal/updater/updater.go || {
            echo "CurrentVersion does not match release version ${VERSION}"
            exit 1
          }

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          HTTP_CODE=$(curl -sSL -o /dev/null -w "%{http_code}"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" || true)
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Release ${VERSION} already exists; nothing to publish."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            if [ "${HTTP_CODE}" != "404" ]; then
              echo "Release existence check returned HTTP ${HTTP_CODE}; continuing with validation."
            fi
          fi

      - name: Set up Go
        if: steps.version.outputs.exists != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        if: steps.version.outputs.exists != 'true'
        run: go test -race ./...

      - name: Govulncheck
        if: steps.version.outputs.exists != 'true'
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Build release binaries
        if: steps.version.outputs.exists != 'true'
        shell: bash
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o build/2cfa-mcp-android-arm64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o build/2cfa-mcp-linux-arm64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/2cfa-mcp-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o build/2cfa-mcp-darwin-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o build/2cfa-mcp-darwin-arm64 ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o build/2cfa-mcp-windows-amd64.exe ./cmd/server
          (
            cd build
            sha256sum 2cfa-mcp-* > SHA256SUMS
          )

      - name: Stage release artifact
        if: steps.version.outputs.exists != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.version.outputs.version }}
          path: build/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: validate-build
    if: needs.validate-build.outputs.exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.validate-build.outputs.version }}
          path: dist

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-build.outputs.version }}
        run: |
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; nothing to publish."
            exit 0
          fi

          gh release create "${VERSION}" dist/*             --repo "${GITHUB_REPOSITORY}"             --target "${GITHUB_SHA}"             --title "${VERSION}"             --generate-notes
